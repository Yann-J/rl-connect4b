[project]
name = "rl-connect4b"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0",
  "onnxscript>=0.1.0",
  "onnxruntime>=1.18.0",
  "PyYAML>=6.0.0",
  "torch>=2.3.0",
  "tensorboard>=2.16.0",
  "kaggle-environments>=1.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
lint.ignore = ["E501"]
