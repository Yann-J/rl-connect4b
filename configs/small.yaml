seed: 0
model:
  hidden: 64
buffer:
  capacity: 50000
selfplay:
  games: 64
  warmup_random_games: 1000
  mcts_sims_selfplay: 100
league:
  size: 10
  current_vs_current_prob: 0.5
eval:
  enabled: true
  games: 20
  mcts_sims_eval: 400
  heldout_size: 10000
