seed: 0
model:
  channels: 64
  blocks: 5
buffer:
  capacity: 50000
selfplay:
  games: 64
  warmup_random_games: 1000
  mcts_sims_selfplay: 100
league:
  size: 10
  current_vs_current_prob: 0.5
eval:
  enabled: true
  games: 10
  mcts_sims_eval: 128
  heldout_size: 1024
  heldout_seed: 0
  heldout_dataset_path: data/heldout_positions_v1.json
  league_games_per_pair: 2
  minimax_depths: [2, 4]
  oracle_depth: 6
  eval_interval_steps: 500
  full_panel_every: 5
  quick:
    games: 6
    mcts_sims_eval: 64
    heldout_size: 256
    minimax_depths: [2]
train:
  epochs: 1
  steps_per_1k_positions: 100
  positions_block: 1000
  batch_size: 128
  lr: 0.01
  cosine_min_lr: 0.0001
output:
  dir: checkpoints/small
logging:
  tensorboard_dir: checkpoints/small/runs
  train_log_every_steps: 10
  selfplay_log_every_games: 10
