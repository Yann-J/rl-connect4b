seed: 0
model:
  channels: 192
  blocks: 15
buffer:
  capacity: 100000
selfplay:
  games: 256
  games_per_refresh: 64
  warmup_random_games: 2000
  mcts_sims_selfplay: 300
league:
  size: 16
  current_vs_current_prob: 0.5
eval:
  enabled: true
  kaggle_matches: false
  games: 32
  mcts_sims_eval: 200
  heldout_size: 2048
  heldout_seed: 0
  heldout_dataset_path: data/heldout_positions_v1.json
  league_games_per_pair: 2
  minimax_depths: [2, 4, 6]
  oracle_depth: 4
  oracle_backend: pons
  eval_interval_steps: 3000
  full_panel_every: 5
  quick:
    games: 10
    mcts_sims_eval: 50
    heldout_size: 0
    minimax_depths: [2]
    oracle_depth: 2
train:
  epochs: 1
  steps: 2000000
  selfplay_every_steps: 250
  positions_block: 1000
  batch_size: 256
  lr: 0.0007
  cosine_min_lr: 0.000005
output:
  dir: checkpoints/large
logging:
  tensorboard_dir: checkpoints/large/runs
  train_log_every_steps: 2
  selfplay_log_every_games: 10
