seed: 0
model:
  channels: 128
  blocks: 10
buffer:
  capacity: 50000
selfplay:
  games: 128
  warmup_random_games: 1000
  mcts_sims_selfplay: 200
league:
  size: 10
  current_vs_current_prob: 0.5
eval:
  enabled: true
  games: 40
  mcts_sims_eval: 400
  heldout_size: 10000
  heldout_seed: 0
  heldout_dataset_path: data/heldout_positions_v1.json
  league_games_per_pair: 2
  minimax_depths: [2, 4, 6, 8]
  oracle_depth: 10
  oracle_backend: minimax
  eval_interval_steps: 1000
  full_panel_every: 1
train:
  epochs: 1
  steps_per_1k_positions: 100
  positions_block: 1000
  batch_size: 256
  lr: 0.001
  cosine_min_lr: 0.00001
output:
  dir: checkpoints/medium
logging:
  tensorboard_dir: checkpoints/medium/runs
