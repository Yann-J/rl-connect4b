seed: 0
model:
  channels: 128
  blocks: 10
buffer:
  capacity: 50000
selfplay:
  games: 128
  warmup_random_games: 1000
  mcts_sims_selfplay: 200
league:
  size: 10
  current_vs_current_prob: 0.5
eval:
  enabled: true
  games: 8
  mcts_sims_eval: 64
  heldout_size: 64
  heldout_seed: 0
  league_games_per_pair: 1
  eval_interval_steps: 1000
  full_panel_every: 3
  initial_games: 4
  initial_heldout_size: 16
train:
  epochs: 1
  steps: 20000
  batch_size: 256
  lr: 0.005
output:
  dir: checkpoints/medium
logging:
  tensorboard_dir: checkpoints/medium/runs
