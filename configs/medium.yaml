seed: 0
model:
  channels: 128
  blocks: 10
buffer:
  capacity: 50000
selfplay:
  games: 128
  games_per_refresh: 32
  warmup_random_games: 1000
  mcts_sims_selfplay: 200
league:
  size: 10
  current_vs_current_prob: 0.5
eval:
  enabled: true
  kaggle_matches: false
  games: 20
  mcts_sims_eval: 100
  heldout_size: 512
  heldout_seed: 0
  heldout_dataset_path: data/heldout_positions_v1.json
  league_games_per_pair: 2
  minimax_depths: [2, 4, 6]
  oracle_depth: 6
  oracle_backend: pons
  eval_interval_steps: 2000
  full_panel_every: 5
  quick:
    games: 8
    mcts_sims_eval: 64
    heldout_size: 128
    minimax_depths: [2, 4]
train:
  epochs: 1
  selfplay_every_steps: 120
  steps_per_1k_positions: 100
  positions_block: 1000
  batch_size: 256
  lr: 0.001
  cosine_min_lr: 0.00001
output:
  dir: checkpoints/medium
logging:
  tensorboard_dir: checkpoints/medium/runs
